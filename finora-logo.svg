<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 96 96" role="img" aria-labelledby="title">
  <title id="title">Finora rupee mark</title>
  <defs>
    <linearGradient id="green" x1="10" y1="8" x2="84" y2="88" gradientUnits="userSpaceOnUse">
      <stop stop-color="#258362"/>
      <stop offset="1" stop-color="#0D4635"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="96" height="96" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="3" stdDeviation="3" flood-color="#0D4635" flood-opacity=".18"/>
    </filter>
  </defs>
  <g filter="url(#shadow)">
    <rect x="4" y="4" width="88" height="88" rx="27" fill="url(#green)"/>
    <rect x="8" y="8" width="80" height="80" rx="23" fill="none" stroke="#FFFFFF" stroke-opacity=".22"/>
    <circle cx="48" cy="48" r="29" fill="#FFFFFF" fill-opacity=".045" stroke="#E6C46E" stroke-opacity=".82" stroke-width="1.5"/>
    <text x="48" y="64" text-anchor="middle" font-family="Arial, sans-serif" font-size="51" font-weight="700" fill="#FFFFFF">₹</text>
  </g>
</svg>
